services:
  # 1. Node.js Express Application
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-server-app
    restart: unless-stopped
    ports:
      - "2000:2000"
    environment:
      - PORT=2000
      - DB_HOST=db-mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=12345
      - DB_NAME=my_app_db
      - JWT_SECRET=evaluation_system_jwt_secret_key_2026
      - JWT_EXPIRES_IN=7d
    depends_on:
      db-mysql:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app-network

  # 2. MySQL Database
  db-mysql:
    image: mysql:8.0
    container_name: mysql-database
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=12345
      - MYSQL_DATABASE=my_app_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks:
      - app-network

  # 3. phpMyAdmin Web Panel
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: myadmin-panel
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db-mysql
      - PMA_PORT=3306
    depends_on:
      db-mysql:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql_data:
  uploads_data:

networks:
  app-network:
    driver: bridge
